# /etc/nginx/sites-available/app.example.com   (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
# Needs deploy/examcards-proxy.conf copied to /etc/nginx/examcards-proxy.conf (see DEPLOY.md).
# Start with this HTTP-only version; `certbot --nginx` then adds the HTTPS server block and the redirect.

# slow down password guessing and floods (the app has its own lockout too)
limit_req_zone $binary_remote_addr zone=examcards_login:10m rate=60r/m;      # generous: a whole class may share one school IP
limit_req_zone $binary_remote_addr zone=examcards_all:10m   rate=20r/s;

# any request for another name / a bare IP address gets no answer at all
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    server_tokens off;
    client_max_body_size 4m;          # avatar uploads are max 2 MB

    location = /login {
        limit_req zone=examcards_login burst=30 nodelay;
        include /etc/nginx/examcards-proxy.conf;
    }

    location / {
        limit_req zone=examcards_all burst=60 nodelay;
        include /etc/nginx/examcards-proxy.conf;
    }
}
