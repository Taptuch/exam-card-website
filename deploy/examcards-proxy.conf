# /etc/nginx/examcards-proxy.conf  - shared proxy settings, included from the site config
proxy_pass         http://127.0.0.1:8000;
proxy_set_header   Host               $host;
proxy_set_header   X-Real-IP          $remote_addr;
proxy_set_header   X-Forwarded-For    $remote_addr;   # overwrite (not append): a client can't fake its address
proxy_set_header   X-Forwarded-Proto  $scheme;
proxy_read_timeout 30s;
