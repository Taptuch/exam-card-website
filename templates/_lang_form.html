{# Language buttons for pages without JavaScript (sign-in, forced password change). Needs `next_page`. #}
<form method="post" action="{{ url_for('set_language') }}" class="lang-form seg" aria-label="{{ t('top.language') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_page }}">
  {% for code in LANGS %}
    <button type="submit" name="lang" value="{{ code }}" aria-pressed="{{ 'true' if code == lang else 'false' }}" lang="{{ code }}">{{ LANG_LABELS[code] }}</button>
  {% endfor %}
</form>
